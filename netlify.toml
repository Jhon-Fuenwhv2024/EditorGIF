# Fotogif en Netlify — producción: https://videogif.trainfit.cloud
[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Variables recomendadas (también en UI de Netlify):
#   VITE_SITE_URL = https://videogif.trainfit.cloud
#   STRIPE_* / VITE_ADSENSE_* según .env.example

# SPA (React Router). Las Functions con config.path=/api/... tienen prioridad.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    # credentialless: compatible con AdSense/Stripe; ffmpeg.wasm es single-thread.
    Cross-Origin-Embedder-Policy = "credentialless"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/ads.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/ffmpeg/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
